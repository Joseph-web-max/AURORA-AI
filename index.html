<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>AURORA AI</title>
<style>
:root{--bg:#212121;--sidebar:#171717;--panel:#2f2f2f;--panel2:#262626;--text:#ececec;--muted:#a1a1aa;--line:#3a3a3a;--hover:#2b2b2b;--accent:#10a37f;--accent2:#19c99a;--shadow:0 8px 30px #0003}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}
.app{height:100%;display:flex;overflow:hidden}.sidebar{width:260px;flex:0 0 260px;background:var(--sidebar);display:flex;flex-direction:column;padding:12px;transition:width .2s,flex-basis .2s;z-index:5}.sidebar.collapsed{width:0;flex-basis:0;padding:0;overflow:hidden}.side-top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 18px}.brand{display:flex;align-items:center;gap:9px;font-weight:750;letter-spacing:.2px}.brand-mark{width:29px;height:29px;border-radius:9px;background:linear-gradient(135deg,#10a37f,#66d9b2);color:#072a20;display:grid;place-items:center;font-size:18px;font-weight:900}.icon-btn{width:35px;height:35px;border:0;border-radius:9px;background:transparent;display:grid;place-items:center;color:var(--muted);font-size:18px}.icon-btn:hover,.nav-btn:hover,.history-item:hover{background:var(--hover);color:var(--text)}.new-chat{display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:transparent;text-align:left;margin-bottom:18px}.new-chat:hover{background:var(--hover)}.nav-label{font-size:11px;color:var(--muted);font-weight:650;padding:9px 9px 5px}.nav-btn{width:100%;display:flex;align-items:center;gap:11px;padding:9px 10px;border:0;border-radius:9px;background:transparent;text-align:left;color:var(--text);font-size:13px}.nav-btn.active{background:#2b2b2b}.nav-icon{width:19px;text-align:center;color:#b7b7b7;font-size:16px}.history{overflow:auto;flex:1;min-height:50px}.history-item{padding:8px 10px;border-radius:8px;color:#c7c7c7;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.side-bottom{padding-top:10px;border-top:1px solid var(--line)}.profile{display:flex;align-items:center;gap:10px;padding:9px;border-radius:10px;cursor:pointer}.profile:hover{background:var(--hover)}.avatar{width:30px;height:30px;border-radius:50%;background:#6658a6;display:grid;place-items:center;font-size:12px;font-weight:700}.profile-info{flex:1;min-width:0}.profile-info b{display:block;font-size:12px}.profile-info small{color:var(--muted);font-size:11px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}.top-left,.top-right{display:flex;align-items:center;gap:8px}.model-select{border:0;background:transparent;padding:8px 10px;border-radius:9px;font-size:16px;font-weight:650}.model-select:hover{background:var(--hover)}.model-select span{color:var(--muted);font-weight:400}.top-action{border:1px solid var(--line);background:transparent;border-radius:20px;padding:7px 12px;font-size:12px}.top-action:hover{background:var(--hover)}.content{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:28px 22px 20px}.welcome{width:min(100%,790px);margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;padding-bottom:8vh}.welcome-mark{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#10a37f,#83ddbb);display:grid;place-items:center;color:#063b2d;font-size:28px;margin-bottom:20px;box-shadow:0 8px 30px #10a37f25}.welcome h1{font-size:30px;line-height:1.2;font-weight:600;margin:0 0 28px;letter-spacing:-.8px}.composer-wrap{width:min(100%,790px);margin:0 auto 14px}.composer{background:var(--panel);border:1px solid #454545;border-radius:25px;padding:12px 14px 10px;box-shadow:var(--shadow)}.composer:focus-within{border-color:#666}.composer textarea{display:block;width:100%;min-height:48px;max-height:190px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font-size:15px;padding:4px 4px 9px}.composer textarea::placeholder{color:#a1a1a1}.composer-tools{display:flex;align-items:center;justify-content:space-between;gap:10px}.tool-group{display:flex;align-items:center;gap:5px}.tool-btn{border:0;background:transparent;color:#c4c4c4;border-radius:18px;padding:7px 10px;font-size:12px}.tool-btn:hover{background:#414141}.tool-btn .plus{font-size:17px;vertical-align:-1px;margin-right:4px}.send-btn{width:34px;height:34px;border:0;border-radius:50%;background:#ececec;color:#171717;font-size:18px;font-weight:800;display:grid;place-items:center}.send-btn:disabled{opacity:.35;cursor:not-allowed}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:min(100%,790px);margin-top:18px}.suggestion{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:transparent;text-align:left;color:#d0d0d0}.suggestion:hover{background:var(--hover)}.suggestion span{font-size:18px;color:#a6a6a6}.suggestion small{display:block;color:var(--muted);font-size:11px}.messages{width:min(100%,790px);margin:0 auto;display:none;flex-direction:column;gap:23px;padding:8px 0 25px}.messages.visible{display:flex}.message{display:flex;gap:13px;align-items:flex-start}.msg-avatar{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;background:#10a37f;color:#082a21;font-weight:900}.msg-body{min-width:0;flex:1;padding-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}.user-message{background:var(--panel);border-radius:20px;padding:11px 16px;max-width:85%;margin-left:auto}.assistant-message{line-height:1.7}.assistant-message .note{color:var(--muted);font-size:12px;margin-top:10px}.bottom-note{font-size:11px;color:#858585;text-align:center;margin-top:10px}.chat-mode .welcome{display:none}.chat-mode .messages{display:flex}.chat-mode .content{justify-content:flex-start}.chat-mode .composer-wrap{margin-top:auto}.page-view{display:none;width:min(100%,980px);margin:24px auto}.page-view.active{display:block}.page-view h1{font-size:27px;font-weight:600;margin:5px 0}.page-view .intro{color:var(--muted);max-width:700px;margin-bottom:23px}.page-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{border:1px solid var(--line);border-radius:14px;padding:17px;background:var(--panel2)}.tile-icon{font-size:21px;margin-bottom:12px}.tile h3{font-size:14px;margin:0 0 5px}.tile p{font-size:12px;color:var(--muted);margin:0}.tile button{margin-top:13px;border:0;background:transparent;color:#77cbb1;padding:0;font-size:12px}.row-card{padding:14px;border:1px solid var(--line);border-radius:12px;margin:9px 0;background:var(--panel2)}.row-card p{color:var(--muted);font-size:12px;margin:5px 0 0}.page-steps{counter-reset:n}.page-step{counter-increment:n;position:relative;border:1px solid var(--line);border-radius:12px;padding:15px 15px 15px 54px;margin:10px 0;background:var(--panel2)}.page-step:before{content:counter(n);position:absolute;left:15px;top:14px;background:#24483f;color:#9ce4c8;border-radius:8px;width:26px;height:26px;display:grid;place-items:center;font-weight:700}.page-step p{color:var(--muted);font-size:12px;margin:4px 0 0}.notice{border:1px solid #675b32;background:#302a1b;color:#e6d7a6;border-radius:10px;padding:12px;font-size:12px;margin-top:16px}.mobile-menu{display:none}.light{--bg:#fff;--sidebar:#f9f9f9;--panel:#f4f4f4;--panel2:#f7f7f7;--text:#242424;--muted:#6b6b6b;--line:#e4e4e4;--hover:#ededed;--shadow:0 8px 30px #0000000c}.light .composer{border-color:#dedede}.light .tool-btn:hover{background:#e6e6e6}.light .model-select:hover{background:#eee}.light .nav-btn.active{background:#e9e9e9}.light .send-btn{background:#222;color:white}
@media(max-width:850px){.sidebar{position:absolute;left:0;top:0;bottom:0;height:100%;box-shadow:var(--shadow)}.sidebar.collapsed{display:none}.mobile-menu{display:grid}.page-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.topbar{padding:0 10px}.content{padding:18px 13px}.welcome h1{font-size:25px}.suggestions{grid-template-columns:1fr}.page-grid{grid-template-columns:1fr}.top-action{display:none}.model-select{font-size:14px}.composer{border-radius:20px}.composer textarea{font-size:14px}.tool-btn{padding:7px 6px}.page-view{margin:15px auto}}
/* ===== Ollama integration ===== */
.dot{width:8px;height:8px;border-radius:50%;background:#888;display:inline-block;flex:none}.dot[data-s=online]{background:#19c99a;box-shadow:0 0 0 3px #19c99a22}.dot[data-s=offline]{background:#ef5b5b}.dot[data-s=checking]{background:#e0b341;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.35}}
.model-select{display:flex;align-items:center;gap:8px;max-width:46vw}.model-select b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;border-radius:20px;padding:6px 11px;font-size:12px;color:var(--muted)}.status-pill:hover{background:var(--hover)}
.menu{display:none;position:absolute;top:52px;left:18px;width:min(320px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;z-index:9;box-shadow:var(--shadow);font-size:13px}.menu.open{display:block}
.mm-h{display:flex;align-items:center;gap:8px;padding:9px 10px;color:var(--muted);font-size:12px}.mm-i{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;border-radius:9px;padding:9px 10px;text-align:left}.mm-i:hover,.mm-f button:hover,.mm-i.sel{background:var(--hover)}.mm-p{padding:8px 10px;color:var(--muted);font-size:12px;margin:0}.mm-f{display:flex;gap:6px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}.mm-f button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips:empty{display:none}.composer>.chips{padding:2px 2px 8px}.user-message .chips{margin-bottom:6px}.user-message{white-space:pre-wrap;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--hover);border:1px solid var(--line);border-radius:9px;padding:3px 8px;font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip button{border:0;background:transparent;padding:0 2px;color:var(--muted);font-size:14px}
.history-item{display:flex;align-items:center;gap:6px}.history-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.history-item.active{background:var(--hover);color:var(--text)}.hx{border:0;background:transparent;color:var(--muted);font-size:16px;padding:0 4px;border-radius:6px;opacity:0}.history-item:hover .hx,.history-item.active .hx{opacity:1}.hx:hover{color:#ef5b5b}.history-empty{padding:8px 10px;color:var(--muted);font-size:12px}@media(hover:none){.hx{opacity:.7}}
.md code{background:var(--hover);border-radius:5px;padding:1px 5px;font:12.5px ui-monospace,Menlo,Consolas,monospace}.code{margin:10px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2);white-space:normal}.code-h{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--hover);font-size:12px;color:var(--muted)}.code-h button{border:0;background:transparent;color:var(--muted);font-size:12px}.code pre{margin:0;padding:12px;overflow-x:auto;white-space:pre}.code pre code{background:none;padding:0;font-size:12.5px;line-height:1.55}
.meta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px;color:var(--muted);font-size:12px;white-space:normal}.meta:empty{display:none}.meta button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:2px 6px;border-radius:6px}.meta button:hover{background:var(--hover);color:var(--text)}.muted{color:var(--muted)}
.dots i{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.sys-error{border:1px solid #7a3b3b;background:#2e1c1c;color:#f0c4c4;border-radius:12px;padding:13px 15px;font-size:13px;white-space:normal}.light .sys-error{background:#fdeeee;color:#7a2020;border-color:#efc2c2}.sys-error small{display:block;opacity:.75;margin-bottom:4px}.sys-error code{font-family:ui-monospace,Menlo,monospace;font-size:12px}.sys-error .row{display:flex;gap:8px;margin-top:10px}
.genbar{display:flex;justify-content:center;margin-bottom:8px}.genbar:empty{display:none}.genbar button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 14px;font-size:12px}.genbar button:hover{background:var(--hover)}
.setup{width:min(100%,790px);margin-top:18px;text-align:left;border:1px solid #675b32;background:#302a1b;color:#e6d7a6;border-radius:13px;padding:14px 16px;font-size:13px}.setup:empty{display:none}.light .setup,.light .notice{background:#fff8e1;color:#6b5514;border-color:#ecd98f}.setup p{margin:6px 0}.setup pre{background:#0003;border-radius:9px;padding:10px 12px;overflow-x:auto;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;margin:8px 0;white-space:pre}.light .setup pre,.light .guide{background:#0000000d}.guide{background:#0003;border-radius:9px;padding:10px 12px;overflow-x:auto;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;margin:8px 0;white-space:pre;color:var(--text)}.setup code,.row-card code{font-family:ui-monospace,Menlo,monospace;font-size:12px}.setup .row{display:flex;gap:8px;flex-wrap:wrap}
.btn,.setup button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;font-size:12px;color:var(--text)}.btn:hover,.setup button:hover{background:var(--hover)}.btn.danger{color:#ef5b5b}
.field{margin-top:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.inline{display:flex;gap:8px;flex-wrap:wrap}.inline input,.inline select,.field textarea,.field select{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--text);outline:0}.field textarea{width:100%;min-height:72px;resize:vertical}.field input[type=range]{width:100%;accent-color:var(--accent)}.set-status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin:6px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);background:#111;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){.status-pill span{display:none}.status-pill{padding:8px}.menu{left:10px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="side-top"><div class="brand"><div class="brand-mark">✳</div><span>AURORA</span></div><button class="icon-btn" title="Close sidebar" onclick="toggleSidebar()">☰</button></div>
  <button class="new-chat" onclick="newChat()"><span style="font-size:18px">＋</span> New chat</button>
  <nav>
    <button class="nav-btn active" data-view="chat" onclick="openView('chat')"><span class="nav-icon">✧</span> Chat</button>
    <button class="nav-btn" data-view="coding" onclick="openView('coding')"><span class="nav-icon">⌘</span> Coding studio</button>
    <button class="nav-btn" data-view="design" onclick="openView('design')"><span class="nav-icon">▧</span> Design studio</button>
    <button class="nav-btn" data-view="video" onclick="openView('video')"><span class="nav-icon">▶</span> Video studio</button>
    <button class="nav-btn" data-view="research" onclick="openView('research')"><span class="nav-icon">⌬</span> Research lab</button>
    <button class="nav-btn" data-view="deploy" onclick="openView('deploy')"><span class="nav-icon">↗</span> Deploy center</button>
  </nav>
  <div class="nav-label">YOUR WORK</div>
  <div class="history" id="history"></div>
  <div class="side-bottom">
    <button class="nav-btn" onclick="openView('agents')"><span class="nav-icon">◈</span> AI agents</button>
    <button class="nav-btn" onclick="openView('roadmap')"><span class="nav-icon">☷</span> Development roadmap</button>
    <button class="nav-btn" onclick="openView('settings')"><span class="nav-icon">⚙</span> Settings</button>
    <div class="profile" onclick="openView('settings')"><div class="avatar">A</div><div class="profile-info"><b>AURORA Workspace</b><small>Ollama edition</small></div><span style="color:var(--muted)">···</span></div>
  </div>
</aside>
<main class="main" id="main">
  <header class="topbar">
    <div class="top-left"><button class="icon-btn mobile-menu" onclick="toggleSidebar()">☰</button><button class="model-select" id="modelBtn" onclick="toggleModelMenu(event)"><i class="dot" data-s="checking"></i><b id="modelName">AURORA</b><span>▾</span></button><div id="modelMenu" class="menu"></div></div>
    <div class="top-right"><button class="status-pill" id="statusPill" title="Ollama connection" onclick="openView('settings')"><i class="dot" data-s="checking"></i><span id="statusText">Checking…</span></button><button class="top-action" onclick="openView('roadmap')">✦ Explore workspace</button><button class="icon-btn" title="Toggle light/dark mode" onclick="toggleTheme()">☼</button></div>
  </header>
  <div class="content" id="content">
    <section class="welcome" id="welcome">
      <div class="welcome-mark">✳</div>
      <h1>What can I help you create?</h1>
      <div class="composer-wrap">
        <div class="composer"><div class="chips"></div>
          <textarea id="prompt" rows="1" placeholder="Message AURORA..." oninput="resizeInput(this)" onkeydown="handleEnter(event)"></textarea>
          <div class="composer-tools"><div class="tool-group"><button class="tool-btn" onclick="document.getElementById('fileInput').click()"><span class="plus">＋</span> Attach</button><input id="fileInput" type="file" multiple hidden onchange="handleFiles(this)"><button class="tool-btn" onclick="openView('coding')">⌘ Code</button><button class="tool-btn" onclick="openView('design')">▧ Design</button></div><div class="tool-group"><button class="tool-btn" onclick="toast('Voice input is not enabled in this build.')">♩</button><button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>↑</button></div></div>
        </div>
        <div class="bottom-note">AURORA can make mistakes. Verify important information and review generated work.</div><div class="bottom-note" id="connNote"></div>
      </div>
      <div id="setup"></div>
      <div class="suggestions">
        <button class="suggestion" onclick="useSuggestion('Build a responsive website with a modern dashboard and authentication.')"><span>⌘</span><div>Build an application<small>Plan and generate a software project</small></div></button>
        <button class="suggestion" onclick="useSuggestion('Create a complete visual identity with a logo direction, color palette and typography.')"><span>✧</span><div>Create a design<small>Branding, graphics and UI/UX</small></div></button>
        <button class="suggestion" onclick="useSuggestion('Create a video script and storyboard for a cinematic product advertisement.')"><span>▶</span><div>Make a video<small>Script, storyboard and production plan</small></div></button>
        <button class="suggestion" onclick="useSuggestion('Explain how to build and evaluate a machine learning model for a real-world problem.')"><span>⌬</span><div>Explore AI research<small>Machine learning and data science</small></div></button>
      </div>
    </section>
    <section class="messages" id="messages"></section>
    <section class="page-view" id="pageView"></section>
  </div>
  <div class="composer-wrap" id="chatComposer" style="display:none"><div class="genbar" id="genBar"></div>
    <div class="composer"><div class="chips"></div>
      <textarea id="followup" rows="1" placeholder="Message AURORA..." oninput="resizeInput(this)" onkeydown="handleEnter(event,true)"></textarea>
      <div class="composer-tools"><div class="tool-group"><button class="tool-btn" onclick="document.getElementById('fileInput2').click()">＋ Attach</button><input id="fileInput2" type="file" multiple hidden onchange="handleFiles(this)"><button class="tool-btn" onclick="openView('coding')">⌘ Code</button></div><button class="send-btn" onclick="sendMessage(true)">↑</button></div>
    </div><div class="bottom-note">Review AI-generated code and content before using or publishing.</div>
  </div>
</main>
</div>
<script>
const pageContent={
coding:`<div class="page-view"><div class="eyebrow">AURORA WORKSPACE</div><h1>Coding studio</h1><p class="intro">Plan, create, test and improve software with a coordinated team of specialist agents.</p><div class="page-grid"><div class="tile"><div class="tile-icon">⌘</div><h3>Project architect</h3><p>Requirements, architecture, folder structures and technical decisions.</p></div><div class="tile"><div class="tile-icon">⌨</div><h3>Code builder</h3><p>Frontend, backend, APIs, databases and mobile applications.</p></div><div class="tile"><div class="tile-icon">⚒</div><h3>Debug & testing</h3><p>Run tests, diagnose errors and review proposed fixes.</p></div></div><div class="notice">Production requirement: execute generated code in isolated, resource-limited sandboxes. This prototype does not execute code.</div></div>`,
design:`<div class="page-view"><div class="eyebrow">AURORA WORKSPACE</div><h1>Design studio</h1><p class="intro">Create a cohesive visual identity, polished interfaces and professional graphic assets.</p><div class="page-grid"><div class="tile"><div class="tile-icon">✧</div><h3>Brand designer</h3><p>Logo concepts, typography, color systems and brand guidelines.</p></div><div class="tile"><div class="tile-icon">▦</div><h3>UI/UX designer</h3><p>User journeys, wireframes, responsive layouts and accessibility.</p></div><div class="tile"><div class="tile-icon">▧</div><h3>Image creator</h3><p>Image generation workflows, posters, banners and social graphics.</p></div></div><div class="notice">Connect an appropriately licensed open image model and GPU worker for live generation.</div></div>`,

const KS='aurora.settings.v2',KC='aurora.chats.v2',els=new WeakMap();

/* ---------- UI helpers ---------- */
let tt;function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3400)}
function copyText(t){return(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();if(!ok)throw 0}).then(()=>toast('Copied'),()=>toast('Copy failed'))}

function toggleSidebar(){$('sidebar').classList.toggle('collapsed')}

function toggleTheme(){S.theme=S.theme==='light'?'dark':'light';applyTheme();saveS()}
function closeMenu(){$('modelMenu').classList.remove('open')}

function renderMd(t){return t.split('```').map((p,i)=>{if(i%2){const m=p.match(/^([\w+#.-]*)\n/),lang=m?m[1]:'',code=m?p.slice(m[0].length):p;return`<div class="code"><div class="code-h"><span>${esc(lang||'code')}</span><button onclick="copyCode(this)">Copy</button></div><pre><code>${esc(code.replace(/\n$/,''))}</code></pre></div>`}return esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')}).join('')}

/* ---------- Ollama connection ---------- */
const ep=()=>S.endpoint.replace(/\/+$/,'');
const hdr=(x)=>{const h={...(x||{})};if((S.apiKey||'').trim())h['Authorization']='Bearer '+S.apiKey.trim();return h};
async function ofetch(path,ms=5000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{return await fetch(ep()+path,{signal:c.signal,headers:hdr()})}finally{clearTimeout(t)}}
async function refreshModels(){if(streaming)return;try{const r=await ofetch('/api/tags');if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();models=(j.models||[]).map(m=>m.name).sort();let v='';try{v=(await(await ofetch('/api/version')).json()).version||''}catch{}if(!models.includes(S.model)){S.model=models[0]||'';saveS()}conn={s:'online',v,err:''}}catch(e){models=[];conn={s:'offline',v:'',err:e.name==='AbortError'?'timed out':e.message}}renderConn()}
function setupHTML(){const on=conn.s==='online';if(conn.s==='checking')return'';return`<div class="setup"><b>${on?'Ollama is running, but no models are installed':'Ollama not detected'}</b><p>${on?'Install a model, then press “Check again”:':`AURORA can’t reach <code>${esc(ep())}</code>. Real AI replies require <b>Ollama running separately</b> on your computer or network. No simulated answers are ever shown.`}</p><pre>${on?'ollama pull llama3.2':'1. Install Ollama from https://ollama.com\n2. ollama pull llama3.2\n3. OLLAMA_ORIGINS="*" ollama serve'}</pre><div class="row"><button onclick="refreshModels()">Check again</button><button onclick="openView(\'settings\')">Endpoint settings</button></div></div>`}
function renderConn(){const on=conn.s==='online';document.querySelectorAll('.dot').forEach(d=>d.dataset.s=conn.s);$('statusText').textContent=on?(models.length?models.length+' model'+(models.length>1?'s':''):'No models'):conn.s==='checking'?'Checking…':'Ollama offline';$('modelName').textContent=S.model||'AURORA';$('connNote').textContent=on?`Connected to Ollama${conn.v?' '+conn.v:''} at ${ep()}${S.model?' · model: '+S.model:''}`:conn.s==='checking'?'Checking Ollama connection…':'Not connected. Replies come only from a real Ollama model; none are simulated.';$('setup').innerHTML=setupHTML();renderModelMenu();updateSettingsLive()}
function renderModelMenu(){const on=conn.s==='online';$('modelMenu').innerHTML=`<div class="mm-h"><i class="dot" data-s="${conn.s}"></i>${on?'Connected to Ollama'+(conn.v?' '+esc(conn.v):''):conn.s==='checking'?'Checking…':'Ollama offline'}</div>`+(models.length?models.map(n=>`<button class="mm-i${n===S.model?' sel':''}" data-m="${esc(n)}" onclick="pickModel(this.dataset.m)">${esc(n)}<span>${n===S.model?'✓':''}</span></button>`).join(''):`<p class="mm-p">${on?'No models installed yet.':'Start Ollama to load your installed models.'}</p>`)+`<div class="mm-f"><button onclick="refreshModels()">↻ Refresh</button><button onclick="closeMenu();openView('settings')">⚙ Settings</button></div>`}
function pickModel(n){S.model=n;saveS();renderConn();closeMenu()}
/* ---------- views ---------- */
function openView(id){curView=id;const page=$('pageView'),composer=$('chatComposer'),main=$('main');document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));if(innerWidth<=850)$('sidebar').classList.add('collapsed');
if(id==='chat'){page.style.display='none';$('welcome').style.display=chatStarted?'none':'flex';$('messages').style.display=chatStarted?'flex':'none';composer.style.display=chatStarted?'block':'none';main.classList.toggle('chat-mode',chatStarted);return}
$('welcome').style.display='none';$('messages').style.display='none';composer.style.display='none';main.classList.remove('chat-mode');page.style.display='block';page.innerHTML=id==='settings'?settingsHTML():pageContent[id]||'';page.querySelector('.page-view').classList.add('active');if(id==='settings')updateSettingsLive();$('content').scrollTop=0}
function settingsHTML(){const opt=[2048,4096,8192,16384,32768].map(n=>`<option value="${n}"${n==S.ctx?' selected':''}>${n.toLocaleString()} tokens</option>`).join('');
return`<div class="page-view"><div class="eyebrow">PREFERENCES</div><h1>Settings</h1><p class="intro">Connect AURORA to a real Ollama server, choose a model and tune how it responds.</p><div class="notice" style="margin:0 0 12px"><b>Ollama must be running separately.</b> It is not part of this HTML file. When it is offline AURORA shows an error and never fakes an AI answer.</div>
<div class="row-card"><b>Ollama connection</b><div id="setStatus" class="set-status"></div><div class="field"><label>Endpoint URL</label><div class="inline"><input id="setEp" value="${esc(S.endpoint)}" spellcheck="false" autocapitalize="off" onkeydown="if(event.key==='Enter')saveEndpoint()"><button class="btn" onclick="saveEndpoint()">Save &amp; connect</button></div></div><div class="field"><label>API key (optional)</label><div class="inline"><input id="setKey" type="password" value="${esc(S.apiKey||'')}" placeholder="Needed for Ollama cloud (https://ollama.com)" spellcheck="false" autocomplete="off" autocapitalize="off" onkeydown="if(event.key==='Enter')saveEndpoint()"><button class="btn" type="button" onclick="const k=$('setKey');k.type=k.type==='password'?'text':'password'">Show</button></div><p>Sent as <code>Authorization: Bearer …</code> with every request. Stored only in this browser. For Ollama cloud, set the endpoint to <code>https://ollama.com</code>. Leave empty for a local server.</p></div></div>
<div class="row-card"><b>Model</b><p>Installed models are retrieved automatically from Ollama.</p><div class="field"><div class="inline"><select id="setModel" onchange="pickModel(this.value)"></select><button class="btn" onclick="refreshModels()">↻ Refresh</button></div></div></div>
<div class="row-card"><b>Generation</b><div class="field"><label>System prompt (optional)</label><textarea id="setSys" placeholder="e.g. You are a concise, helpful assistant." oninput="S.system=this.value;saveS()">${esc(S.system)}</textarea></div><div class="field"><label>Temperature: <span id="tv">${S.temperature}</span></label><input type="range" min="0" max="1.5" step="0.1" value="${S.temperature}" oninput="S.temperature=+this.value;$('tv').textContent=this.value;saveS()"></div><div class="field"><label>Context window (num_ctx) — older messages are dropped to fit</label><select onchange="S.ctx=+this.value;saveS()">${opt}</select></div></div>
<div class="row-card"><b>Appearance &amp; data</b><p>Chats and settings are stored only in this browser (localStorage). Image attachments are kept for the current session only.</p><div class="inline" style="margin-top:10px"><button class="btn" onclick="toggleTheme()">☼ Toggle light / dark</button><button class="btn" onclick="exportChats()">Export chats</button><button class="btn danger" onclick="clearChats()">Delete all chats</button></div></div>
<div class="row-card"><b>Setup guide</b><div class="guide">ollama pull llama3.2\nOLLAMA_ORIGINS="*" ollama serve</div><p>Install Ollama from ollama.com. If it runs but AURORA stays offline, the browser is probably blocking the request: set the <code>OLLAMA_ORIGINS</code> environment variable to allow this page's origin and restart Ollama. Pages served over HTTPS may not be able to reach an http:// endpoint on another machine.</p></div>
<div class="row-card"><b>Production inference</b><p>vLLM can serve supported open-weight models on suitable GPU infrastructure.</p></div><div class="row-card"><b>Model licences</b><p>Review each model and dataset licence. Open weights do not automatically mean unrestricted commercial use.</p></div></div>`}
function updateSettingsLive(){const s=$('setStatus');if(!s||curView!=='settings')return;const on=conn.s==='online';s.innerHTML=`<i class="dot" data-s="${conn.s}"></i><span>`+(on?`Connected${conn.v?' · Ollama '+esc(conn.v):''} · ${models.length} model${models.length==1?'':'s'} found`:conn.s==='checking'?'Checking…':'Offline'+(conn.err?' — '+esc(conn.err):''))+'</span>';$('setModel').innerHTML=models.length?models.map(n=>`<option${n===S.model?' selected':''}>${esc(n)}</option>`).join(''):'<option value="">No models available</option>'}
async function saveEndpoint(){let v=$('setEp').value.trim();if(!v)return;if(!/^https?:\/\//i.test(v))v='http://'+v;try{new URL(v)}catch{return toast('Invalid URL')}S.endpoint=v.replace(/\/+$/,'');$('setEp').value=S.endpoint;S.apiKey=($('setKey')?$('setKey').value:S.apiKey||'').trim();saveS();conn.s='checking';renderConn();await refreshModels();toast(conn.s==='online'?'Connected to Ollama':'Could not reach Ollama at '+S.endpoint)}
function exportChats(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(chats.map(c=>({...c,messages:c.messages.map(({images,...m})=>m)})),null,2)],{type:'application/json'}));a.download='aurora-chats.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function clearChats(){if(!confirm('Delete all saved chats? This cannot be undone.'))return;stopGen();chats=[];saveC();newChat()}
/* ---------- chats & history ---------- */
function newChat(){stopGen();cur=null;notice=null;chatStarted=false;pending=[];renderChips();['prompt','followup'].forEach(i=>{$(i).value='';$(i).style.height='auto'});renderMessages();openView('chat');renderHistory();syncSend()}
function openChat(c){stopGen();cur=c;notice=null;chatStarted=c.messages.length>0;openView('chat');renderMessages(true);renderHistory()}
function delChat(c){if(c===cur){stopGen();cur=null;chatStarted=false;notice=null;renderMessages();openView('chat')}chats=chats.filter(x=>x!==c);saveC();renderHistory()}
function renderHistory(){const h=$('history');h.innerHTML='';if(!chats.length){h.innerHTML='<div class="history-empty">No chats yet</div>';return}chats.slice(0,50).forEach(c=>{const d=document.createElement('div');d.className='history-item'+(c===cur?' active':'');const s=document.createElement('span');s.textContent=c.title;const x=document.createElement('button');x.className='hx';x.title='Delete chat';x.textContent='×';x.onclick=e=>{e.stopPropagation();delChat(c)};d.append(s,x);d.onclick=()=>openChat(c);h.appendChild(d)})}
function useSuggestion(t){$('prompt').value=t;resizeInput($('prompt'));$('prompt').focus()}
function resizeInput(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,190)+'px';syncSend()}
function handleEnter(e,follow=false){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!streaming)sendMessage(follow)}}
function syncSend(){$('sendBtn').disabled=!streaming&&!$('prompt').value.trim()&&!pending.length}
function setBusy(b){streaming=b;document.querySelectorAll('.send-btn').forEach(x=>{x.textContent=b?'■':'↑';x.title=b?'Stop generating':'Send';x.disabled=false});syncSend();renderGen()}
function renderGen(){const last=cur&&cur.messages[cur.messages.length-1];$('genBar').innerHTML=streaming?'<button onclick="stopGen()">■ Stop generating</button>':last?'<button onclick="regen()">↻ Regenerate response</button>':''}
/* ---------- messages ---------- */
function paint(m){const md=els.get(m);if(!md)return;md.innerHTML=m.content?renderMd(m.content):(m===streamMsg?(m.thinking?'<span class="muted">Thinking…</span>':'<span class="dots"><i></i><i></i><i></i></span>'):'')}
function appendMessage(m){const w=document.createElement('div');w.className='message';
if(m.role==='user'){const b=document.createElement('div');b.className='user-message';if(m.files&&m.files.length){const f=document.createElement('div');f.className='chips';f.innerHTML=m.files.map(x=>`<span class="chip">${x.kind==='image'?'🖼':'📄'} ${esc(x.name)}</span>`).join('');b.appendChild(f)}if(m.content){const t=document.createElement('div');t.textContent=m.content;b.appendChild(t)}w.appendChild(b)}
else{w.innerHTML='<div class="msg-avatar">✳</div><div class="msg-body assistant-message"><div class="md"></div><div class="meta"></div></div>';els.set(m,w.querySelector('.md'));paint(m);const meta=w.querySelector('.meta');if(m!==streamMsg){const s=document.createElement('span');s.textContent='Generated by '+(m.model||'Ollama')+(m.tps?' · '+m.tps+' tok/s':'')+(m.stopped?' · stopped':'')+(m.interrupted?' · connection lost':'');const b=document.createElement('button');b.textContent='Copy';b.onclick=()=>copyText(m.content);meta.append(s,b)}}
$('messages').appendChild(w)}
function renderMessages(force){const el=$('messages');el.innerHTML='';(cur?cur.messages:[]).forEach(appendMessage);if(notice){const n=document.createElement('div');n.className='sys-error';n.innerHTML=`<small>System message — not an AI response</small><b>${notice.t}</b><div>${notice.h}</div><div class="row"><button class="btn" onclick="regen()">↻ Retry</button><button class="btn" onclick="openView('settings')">Settings</button></div>`;el.appendChild(n)}renderGen();scrollEnd(force)}
function errNotice(e){const net=e instanceof TypeError||/Failed to fetch|NetworkError|Load failed/i.test(e.message);return net?{t:'Couldn’t reach Ollama',h:`No response from <code>${esc(ep())}</code>. Ollama must be installed and running separately, and it must allow this page’s origin (<code>OLLAMA_ORIGINS="*"</code>). You can also change the endpoint in Settings.`}:{t:'Ollama returned an error',h:esc(e.message)+(/HTTP (401|403)|unauthorized|forbidden/i.test(e.message)?'<br>Check your API key in Settings.':'')+(/not found/i.test(e.message)?`<br>Install it first: <code>ollama pull ${esc(S.model)}</code>`:'')}}
/* ---------- files ---------- */
const TXT=/\.(txt|md|markdown|json|csv|tsv|log|xml|html?|css|js|jsx|ts|tsx|py|java|c|cpp|h|hpp|cs|go|rs|rb|php|sh|bat|sql|ya?ml|toml|ini|cfg|env|swift|kt|r|lua|tex)$/i;
function handleFiles(inp){[...inp.files].forEach(f=>{if(f.type.startsWith('image/')){if(f.size>10e6)return toast(f.name+' is larger than 10 MB');const r=new FileReader();r.onload=()=>{pending.push({name:f.name,kind:'image',data:String(r.result).split(',')[1]});renderChips()};r.readAsDataURL(f)}
else if(f.type.startsWith('text/')||f.type==='application/json'||TXT.test(f.name)){const r=new FileReader();r.onload=()=>{let t=String(r.result);if(t.includes('\u0000'))return toast(f.name+' looks like a binary file');if(t.length>120000){t=t.slice(0,120000)+'\n…[truncated]';toast(f.name+' truncated to 120,000 characters')}pending.push({name:f.name,kind:'text',text:t});renderChips()};r.readAsText(f)}
else toast(f.name+': unsupported type. Attach text, code or image files.')});inp.value=''}
function renderChips(){document.querySelectorAll('.composer .chips').forEach(c=>{c.innerHTML='';pending.forEach((f,i)=>{const s=document.createElement('span');s.className='chip';s.textContent=(f.kind==='image'?'🖼 ':'📄 ')+f.name+' ';const b=document.createElement('button');b.textContent='×';b.title='Remove';b.onclick=()=>{pending.splice(i,1);renderChips()};s.appendChild(b);c.appendChild(s)})});syncSend()}
/* ---------- chat with Ollama ---------- */
function toApi(m){let c=m.content||'';(m.docs||[]).forEach(d=>c+=`\n\n[Attached file: ${d.name}]\n\`\`\`\n${d.text}\n\`\`\``);const o={role:m.role,content:c};if(m.images&&m.images.length)o.images=m.images;return o}
function buildContext(chat){const budget=S.ctx*3.2,conv=chat.messages.filter(m=>m.role==='user'||m.content),out=[];let used=S.system.length;for(let i=conv.length-1;i>=0;i--){const m=toApi(conv[i]);used+=m.content.length;if(used>budget&&out.length)break;out.unshift(m)}if(S.system.trim())out.unshift({role:'system',content:S.system});return out}
function sendMessage(follow=false){if(streaming)return stopGen();const input=$(follow?'followup':'prompt'),text=input.value.trim();if(!text&&!pending.length)return;
if(!cur){cur={id:Date.now().toString(36),title:(text||pending[0].name).slice(0,40),messages:[]};chats.unshift(cur)}
cur.messages.push({role:'user',content:text,files:pending.map(f=>({name:f.name,kind:f.kind})),images:pending.filter(f=>f.kind==='image').map(f=>f.data),docs:pending.filter(f=>f.kind==='text').map(f=>({name:f.name,text:f.text}))});
pending=[];renderChips();['prompt','followup'].forEach(i=>{$(i).value='';$(i).style.height='auto'});chatStarted=true;notice=null;openView('chat');renderMessages(true);saveC();renderHistory();runAssistant()}
function regen(){if(streaming||!cur)return;const m=cur.messages;if(m.length&&m[m.length-1].role==='assistant')m.pop();if(!m.length)return;notice=null;saveC();runAssistant()}
function stopGen(){if(abortC)abortC.abort()}
async function runAssistant(){if(streaming||!cur)return;const chat=cur;notice=null;
if(!S.model){notice=conn.s==='online'?{t:'No model installed',h:'Ollama is running but has no models. Run <code>ollama pull llama3.2</code> in a terminal, then choose it from the model menu.'}:errNotice(new TypeError('Failed to fetch'));renderMessages(true);return}
const msg={role:'assistant',content:'',model:S.model};chat.messages.push(msg);streamMsg=msg;abortC=new AbortController();const signal=abortC.signal;setBusy(true);renderMessages(true);let err=null;
try{const r=await fetch(ep()+'/api/chat',{method:'POST',headers:hdr({'Content-Type':'application/json'}),signal,body:JSON.stringify({model:S.model,stream:true,messages:buildContext(chat),options:{temperature:+S.temperature,num_ctx:+S.ctx}})});
if(!r.ok){let t='';try{t=(await r.json()).error}catch{}throw new Error(t||'HTTP '+r.status)}
conn={...conn,s:'online'};document.querySelectorAll('.dot').forEach(d=>d.dataset.s='online');
const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
const handle=l=>{const j=JSON.parse(l);if(j.error)throw new Error(j.error);if(j.message){if(j.message.thinking)msg.thinking=true;if(j.message.content){msg.content+=j.message.content}}if(j.done&&j.eval_count&&j.eval_duration)msg.tps=(j.eval_count/(j.eval_duration/1e9)).toFixed(1);if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(cur===chat){paint(msg);scrollEnd()}})};
for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){const l=buf.slice(0,i).trim();buf=buf.slice(i+1);if(l)handle(l)}}if(buf.trim())handle(buf.trim())}
catch(e){if(e.name==='AbortError')msg.stopped=true;else err=e}
cancelAnimationFrame(raf);raf=0;streamMsg=null;abortC=null;
if(!msg.content){chat.messages.splice(chat.messages.indexOf(msg),1);if(!msg.stopped)err=err||new Error('The model returned an empty response.')}else if(err)msg.interrupted=true;
if(err&&cur===chat){notice=errNotice(err);if(err instanceof TypeError){conn={s:'offline',v:'',err:err.message};renderConn()}}
setBusy(false);if(cur===chat)renderMessages();saveC();renderHistory()}

load();applyTheme();if(innerWidth<=850)$('sidebar').classList.add('collapsed');renderHistory();renderConn();refreshModels();
setInterval(()=>{if(!document.hidden)refreshModels()},20000);addEventListener('focus',refreshModels);
document.addEventListener('click',e=>{if(!e.target.closest('#modelMenu,#modelBtn'))closeMenu();if(innerWidth<=850&&!e.target.closest('#sidebar,.mobile-menu'))$('sidebar').classList.add('collapsed')});
</script>
